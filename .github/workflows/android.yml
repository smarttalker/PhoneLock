name: Android build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project sources
        run: |
          if [ ! -f PhoneLock.zip ]; then
            echo "::error::PhoneLock.zip не найден в корне репозитория"
            exit 1
          fi
          unzip -o PhoneLock.zip -d .
          ls -la PhoneLock

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Clean Gradle cache
        working-directory: PhoneLock
        run: gradle clean --no-daemon

      - name: Build debug APK
        working-directory: PhoneLock
        run: gradle :app:assembleDebug --no-daemon --refresh-dependencies

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLock-debug
          path: PhoneLock/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
