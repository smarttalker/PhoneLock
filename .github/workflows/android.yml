name: Android build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # В репозитории нет gradlew/gradle-wrapper.jar — gradle/actions/setup-gradle
      # сам ставит нужный Gradle и кэширует его между запусками.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLock-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
